name: Plugin Runtime & Compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  runtime-test:
    name: Plugin Runtime Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install --prefer-binary -r requirements.txt

      - name: Basis-/Head-SHA bestimmen
        id: diff-shas
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "base_sha=4b825dc642cb6eb9a060e54bf8d69288fbee4904" >> "$GITHUB_OUTPUT"
            else
              echo "base_sha=$BEFORE" >> "$GITHUB_OUTPUT"
            fi
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Geänderte Plugins erkennen
        id: detect-plugins
        env:
          BASE_SHA: ${{ steps.diff-shas.outputs.base_sha }}
          HEAD_SHA: ${{ steps.diff-shas.outputs.head_sha }}
        run: |
          python3 .github/scripts/detect_changed_plugins.py > changed_plugins.txt
          echo "plugins=$(cat changed_plugins.txt)" >> $GITHUB_OUTPUT

      - name: Runtime Tests ausführen
        if: steps.detect-plugins.outputs.plugins != ''
        run: |
          python3 .github/scripts/runtime_plugin_test.py \
            --plugins "${{ steps.detect-plugins.outputs.plugins }}" \
            --python-version "${{ matrix.python-version }}" \
            --output runtime-results-${{ matrix.python-version }}.json

      - name: Leere Ergebnisse erstellen
        if: steps.detect-plugins.outputs.plugins == ''
        run: |
          echo '[]' > runtime-results-${{ matrix.python-version }}.json

      - name: Test-Artefakte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-results-${{ matrix.python-version }}
          path: runtime-results-${{ matrix.python-version }}.json
          retention-days: 7

  report:
    name: Ergebnisse melden
    needs: runtime-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install --prefer-binary -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-results-*
          path: .
          merge-multiple: true

      - name: Ergebnisse sammeln
        run: |
          python3 .github/scripts/collect_runtime_results.py \
            --baseline runtime-results-3.11.json \
            --latest runtime-results-3.12.json \
            --baseline-version "3.11" \
            --latest-version "3.12" \
            --output final-runtime-results.json

      - name: PR Kommentar posten
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/runtime_pr_comment.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Final-Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-runtime-results
          path: final-runtime-results.json
          retention-days: 7
